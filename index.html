<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feature adoption</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070d;--card:#0c1120;--hov:#121830;--ink:#eef0fb;--mut:#8e97b3;--line:#1b2238;--track:#171e34;--acc:#8b7dff;--r:#ff6b70;--a:#ffb937;--g:#2fd58a;--rbg:rgba(255,107,112,.15);--abg:rgba(255,185,55,.15);--gbg:rgba(47,213,138,.15)}
:root[data-theme="light"]{--bg:#f2f3fa;--card:#fff;--hov:#f6f7fd;--ink:#0f1633;--mut:#6a7390;--line:#e4e7f2;--track:#e8ebf6;--acc:#5b4bff;--r:#e5484d;--a:#e8920c;--g:#12a865;--rbg:rgba(229,72,77,.12);--abg:rgba(232,146,12,.14);--gbg:rgba(18,168,101,.13)}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(900px 420px at 88% -8%,color-mix(in srgb,var(--acc) 20%,transparent),transparent 70%),var(--bg);padding:28px 20px 40px}
.wrap{max-width:1180px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
h1{font-size:32px;font-weight:800;letter-spacing:-.03em;margin:0}
.sub{color:var(--mut);font-size:14px;margin:6px 0 0}
.ctl{display:flex;gap:8px}
.btn{font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 13px;cursor:pointer}
.btn:hover{border-color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.note{margin:16px 0 18px;font-size:13px;color:var(--mut);background:var(--abg);border-radius:12px;padding:10px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px}
.hero{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;margin-bottom:16px}
.ringcard{padding:24px;display:flex;flex-direction:column;align-items:center;gap:20px}
.ringwrap{position:relative;width:216px;height:216px}
.ring{position:absolute;inset:0;border-radius:50%;-webkit-mask:radial-gradient(circle,transparent 62%,#000 63%);mask:radial-gradient(circle,transparent 62%,#000 63%)}
.rc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rc b{font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1}
.rc span{font-size:12px;color:var(--mut);margin-top:6px}
.legend{width:100%;display:grid;gap:6px}
.lg{display:flex;align-items:center;gap:10px;width:100%;font:inherit;font-size:13px;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left}
.lg:hover,.lg.on{background:var(--hov);border-color:var(--line)}
.lg i{width:10px;height:10px;border-radius:3px;flex:none}
.lg span{flex:1}.lg b{font-variant-numeric:tabular-nums}
.stats{padding:26px;display:flex;flex-direction:column;justify-content:space-between;gap:22px}
.stats h2{font-size:15px;font-weight:700;margin:0;color:var(--mut)}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:18px}
.nums div b{display:block;font-size:40px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.05}
.nums div span{font-size:13px;color:var(--mut)}
.split{height:16px;border-radius:999px;background:var(--abg);overflow:hidden}
.split i{display:block;height:100%;background:var(--g);border-radius:999px}
.splitl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:8px}
.chip{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:600;color:var(--g);background:var(--gbg);border-radius:999px;padding:7px 13px;align-self:flex-start}
.panel{overflow:hidden}
.bar{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.search{flex:1 1 240px;max-width:340px;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.search:focus{outline:2px solid var(--acc);outline-offset:0;border-color:var(--acc)}
.fl{display:flex;gap:6px;flex-wrap:wrap}
.fb{font:inherit;font-size:13px;font-weight:600;color:var(--mut);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer}
.fb.on{color:var(--ink);background:var(--hov);border-color:var(--acc)}
.scroll{max-height:640px;overflow:auto}
table{width:100%;min-width:820px;border-collapse:separate;border-spacing:0;font-size:14px}
th{position:sticky;top:0;z-index:1;background:var(--card);text-align:left;font-size:12px;font-weight:600;color:var(--mut);padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--ink)}
td{padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--hov)}
.n{text-align:right}
.co{display:flex;align-items:center;gap:12px}
.av{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;flex:none}
.co b{font-weight:600;display:block}.co small{color:var(--mut);font-size:12px}
.gauge{--c:var(--g);width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--track) 0);display:inline-grid;place-items:center;position:relative;font-size:12px;font-weight:700;color:var(--c)}
.gauge::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--card)}
tr:hover .gauge::before{background:var(--hov)}
.gauge i{position:relative;font-style:normal}
.tr{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.d{font-weight:700;font-size:13px;min-width:44px;text-align:right}
.up{color:var(--g)}.dn{color:var(--r)}
.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:13px 20px;font-size:12px;color:var(--mut)}
.scrim{position:fixed;inset:0;background:rgba(5,8,20,.5);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--card);border-left:1px solid var(--line);padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));overflow:auto;transform:translateX(102%);transition:transform .25s ease;z-index:21}
.drawer.open{transform:none}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px}
.dh .co b{font-size:20px;font-weight:800;letter-spacing:-.02em}
.ds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:22px}
.ds div{background:var(--bg);border-radius:14px;padding:12px 8px;text-align:center}
.ds b{display:block;font-size:22px;font-weight:800}.ds span{font-size:11px;color:var(--mut)}
.dt{font-size:13px;font-weight:700;color:var(--mut);margin:0 0 10px}
.qs{display:flex;gap:10px;align-items:flex-end;height:96px;margin-bottom:24px}
.qs div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;font-size:12px;color:var(--mut)}
.qs i{display:block;width:100%;border-radius:8px 8px 4px 4px;min-height:4px}
.qs b{color:var(--ink);font-size:12px}
.ft{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.ft:last-child{border:0}
.st{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.on1{background:var(--gbg);color:var(--g)}.off1{background:var(--abg);color:var(--a)}
@media (max-width:820px){.hero{grid-template-columns:1fr}h1{font-size:26px}.ds{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){.drawer,.scrim{transition:none}}
[hidden]{display:none!important}
.povtag{display:inline-block;font-size:12px;font-weight:700;padding:4px 9px;border-radius:8px;background:var(--rbg);color:var(--acc);white-space:nowrap}
.povtag.warn{background:var(--abg);color:var(--a)}
.povtag.big{font-size:12px;letter-spacing:.04em}
.muted{color:var(--mut)}
.povbox{display:flex;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:18px}
.povbox b{display:block;font-size:15px}
.povbox span{font-size:12px;color:var(--mut)}
.povbox.none{color:var(--mut);font-size:14px}
.pcard.others{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.ochart svg{width:130px;height:130px;display:block;margin:0 auto}
.oinfo{width:100%}
.oinfo h2{font-size:18px;font-weight:800;letter-spacing:-.02em;margin:0}
.oinfo p{margin:4px 0 14px}
.olegend div{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.olegend div:last-child{border:0}
.olegend i{width:10px;height:10px;border-radius:3px;flex:none}
.olegend span{flex:1;color:var(--ink)}
.olegend b{font-variant-numeric:tabular-nums}
.olegend small{color:var(--mut);margin-left:6px}
[hidden]{display:none!important}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
@media (max-width:1100px){.products{grid-template-columns:repeat(2,1fr)}}
@media (max-width:820px){.products{grid-template-columns:1fr}}
.pcard{font:inherit;color:var(--ink);text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:10px;transition:border-color .2s,transform .2s}
button.pcard{cursor:pointer}
button.pcard:hover{border-color:var(--acc);transform:translateY(-2px)}
.pcard.soon{opacity:.6;cursor:not-allowed}
.picon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:.02em;color:#fff;background:linear-gradient(135deg,var(--acc),#22b8cf)}
.pcard.soon .picon{background:var(--track);color:var(--mut)}
.pcard h3{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:6px 0 0}
.pcard p{margin:0;color:var(--mut);font-size:13px;line-height:1.5;flex:1}
.ptag{font-size:12px;font-weight:700;color:var(--g)}
.pcard.soon .ptag{color:var(--mut)}
.pgo{font-size:13px;font-weight:700;color:var(--acc)}
.mops-view{max-width:1180px;margin:0 auto;padding:0 0 20px}
.mops-bar{display:flex;align-items:center;gap:14px;margin:0 0 14px}
.mops-title{font-weight:700;color:var(--mut)}
#mopsFrame{display:block;width:100%;height:calc(100vh - 120px);min-height:760px;border:1px solid var(--line);border-radius:20px;background:var(--card)}
.backbtn{font:inherit;font-weight:700;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--acc),#22b8cf);border:0;border-radius:12px;padding:11px 18px;cursor:pointer;box-shadow:0 10px 26px -10px var(--acc);transition:transform .2s,box-shadow .2s;display:inline-flex;align-items:center}
.backbtn::before{content:"←";display:inline-block;margin-right:8px;animation:nudge 1.6s ease-in-out infinite}
.backbtn:hover{transform:translateX(-4px);box-shadow:0 14px 30px -10px var(--acc)}
.backbtn:focus-visible{outline:2px solid #fff;outline-offset:3px}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(-5px)}}
@media (prefers-reduced-motion:reduce){.backbtn::before{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1 data-t="title"></h1><p class="sub" id="sub"></p></div>
    <div class="ctl"><button class="btn" id="lang">ES</button><button class="btn" id="theme" aria-label="Toggle theme">◐</button></div>
  </header>
  <div class="note home" data-t="disc"></div>

  <section class="products home" aria-label="Products">
    <button class="pcard live" type="button" data-open="mops">
      <span class="ptag" data-t="live"></span>
      <span class="picon">ZIA</span>
      <h3>ZIA MOPS</h3>
      <p data-t="ziaD"></p>
      <span class="pgo" data-t="open"></span>
    </button>
    <div class="pcard soon" aria-disabled="true">
      <span class="ptag" data-t="soon"></span>
      <span class="picon">ZPA</span>
      <h3>ZPA MOPS</h3>
      <p data-t="zpaD"></p>
    </div>
    <div class="pcard soon" aria-disabled="true">
      <span class="ptag" data-t="soon"></span>
      <span class="picon">ZDX</span>
      <h3>ZDX MOPS</h3>
      <p data-t="zdxD"></p>
    </div>
    <div class="pcard soon" aria-disabled="true">
      <span class="ptag" data-t="soon"></span>
      <span class="picon">+</span>
      <h3>OTHER</h3>
      <p data-t="otherD"></p>
    </div>
  </section>

  <section class="hero home">
    <div class="card ringcard">
      <div class="ringwrap"><div class="ring" id="ring"></div><div class="rc"><b id="avg"></b><span data-t="avgL"></span></div></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="card stats">
      <h2 data-t="pva"></h2>
      <div class="nums" id="nums"></div>
      <div><div class="split"><i id="split"></i></div><div class="splitl" id="splitl"></div></div>
      <span class="chip" id="chip"></span>
    </div>
  </section>

  <section class="card panel home">
    <div class="bar">
      <input class="search" id="q" type="text" data-ph="search" autocomplete="off">
      <div class="fl" id="fl"></div>
    </div>
    <div class="scroll"><table><thead><tr id="head"></tr></thead><tbody id="rows"></tbody></table></div>
    <div class="foot"><span id="cnt"></span><span data-t="rule"></span></div>
  </section>
</div>
<section id="viewMops" class="mops-view" hidden>
  <div class="mops-bar">
    <button class="backbtn" id="backBtn" type="button"></button>
    <span class="mops-title" data-t="mopsTitle"></span>
  </div>
  <iframe id="mopsFrame" title="ZIA MOPS dashboard"></iframe>
</section>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Company detail"></aside>

r e = t.features[f.id] || {};\n      return { f: f, name: f.name, type: f.type, status: f.status, enabled: !!e.enabled, ticket: e.ticketRef || '', date: e.enabledDate || '' };\n    });\n  }\n  function viewRows() {\n    var q = state.q.trim().toLowerCase();\n    var rows = allRows().filter(function (r) {\n      if (state.status !== 'ALL' && r.status !== state.status) return false;\n      if (state.enabled === 'on' && !r.enabled) return false;\n      if (state.enabled === 'off' && r.enabled) return false;\n      if (state.type !== 'all' && r.type !== state.type) return false;\n      if (q && (r.name + ' ' + r.f.description + ' ' + r.f.explanation + ' ' + r.ticket).toLowerCase().indexOf(q) < 0) return false;\n      return true;\n    });\n    var k = state.sort.key, d = state.sort.dir;\n    rows.sort(function (a, b) {\n      var x, y;\n      if (k === 'status') { x = ORDER[a.status]; y = ORDER[b.status]; }\n      else if (k === 'enabled') { x = a.enabled ? 1 : 0; y = b.enabled ? 1 : 0; }\n      else { x = a[k]; y = b[k]; if ((k === 'ticket' || k === 'date') && (!x || !y)) { if (!x && !y) return 0; return !x ? 1 : -1; } }\n      var c = typeof x === 'number' ? x - y : String(x).localeCompare(String(y), undefined, { numeric: true });\n      return (c || a.name.localeCompare(b.name, undefined, { numeric: true })) * d;\n    });\n    return rows;\n  }\n\n  /* ---------- tenant picker ---------- */\n  function matchingTenants() {\n    var q = $('tenantSearch').value.trim().toLowerCase();\n    return D.tenants.filter(function (t) { return !q || (t.name + ' ' + t.id).toLowerCase().indexOf(q) >= 0; });\n  }\n  function renderPicker() {\n    var list = matchingTenants(), sel = $('tenantSelect');\n    if (list.length && !list.some(function (t) { return t.id === state.tenantId; })) state.tenantId = list[0].id;\n    sel.innerHTML = list.map(function (t) { return '<option value=\"' + esc(t.id) + '\"' + (t.id === state.tenantId ? ' selected' : '') + '>' + esc(t.name) + ' (' + esc(t.i ows.forEach(function (r) {\n      var f = r.f, open = !!state.open[f.id], hi = f.status === 'HIGH';\n      html += '<tr class=\"frow ' + f.status + (open ? ' open' : '') + (r.enabled ? '' : ' is-off') + '\" data-id=\"' + f.id + '\" tabindex=\"0\" aria-expanded=\"' + open + '\">' +\n        '<td><span class=\"twisty\">▶<\/span><\/td>' +\n        '<td><div class=\"fname\">' + (hi ? '<span class=\"warn\" title=\"High-risk feature\">⚠<\/span>' : '') + esc(f.name) + '<\/div><div class=\"fdesc\">' + esc(f.description) + '<\/div><\/td>' +\n        '<td>' + typeBadge(f.type) + '<\/td><td>' + statusBadge(f.status) + '<\/td><td>' + enabledBadge(r.enabled) + '<\/td>' +\n        '<td>' + (r.ticket ? esc(r.ticket) : '<span class=\"muted\">' + (f.status === 'NO' ? 'not needed' : '—') + '<\/span>') + '<\/td>' +\n        '<td>' + (r.date ? esc(r.date) : '<span class=\"muted\">—<\/span>') + '<\/td><\/tr>';\n      if (open) {\n        html += '<tr class=\"detail ' + f.status + '\"><td colspan=\"7\"><h4>Explanation<\/h4><div>' + esc(f.explanation) + '<\/div>' +\n          '<div class=\"small\" style=\"margin-top:6px\">' + esc(ST[f.status].detail) + '<\/div>';\n        if (hi && f.testingGuidance) {\n          html += '<div class=\"box\"><h4>⚠ Recommended testing guidance (unit testing during enablement)<\/h4><ol>' +\n            f.testingGuidance.map(function (g) { return '<li>' + esc(g) + '<\/li>'; }).join('') + '<\/ol><\/div>';\n        }\n        html += '<\/td><\/tr>';\n      }\n    });\n    $('featBody').innerHTML = html || '<tr><td colspan=\"7\" class=\"empty\">No features match the current filters.<\/td><\/tr>';\n    $('rowCount').textContent = 'Showing ' + rows.length + ' of ' + D.features.length + ' features for ' + tenant().name;\n    document.querySelectorAll('#featTable th[data-sort]').forEach(function (th) {\n      var on = th.dataset.sort === state.sort.key;\n      th.classList.toggle('sorted', on);\n      th.querySelector('.arr') && th.querySelector('.arr').remove();\n ad = '<thead><tr><th class=\"cust\">Customer<\/th>' + D.features.map(function (f) { return '<th title=\"' + esc(f.name) + '\">' + esc(f.id) + '<br>' + (f.status === 'HIGH' ? '⚠' : '&nbsp;') + '<\/th>'; }).join('') + '<th>On<\/th><\/tr><\/thead>';\n    var body = ts.map(function (t) {\n      var n = 0;\n      var cells = D.features.map(function (f) {\n        var e = t.features[f.id] || {}, on = !!e.enabled; if (on) n++;\n        return '<td><span class=\"cell ' + f.status + ' ' + (on ? 'on' : 'off') + '\" title=\"' + esc(f.name + ' — ' + ST[f.status].label + ' — ' + (on ? 'Enabled' : 'Not enabled') + (e.ticketRef ? ' (' + e.ticketRef + ')' : '')) + '\">' + (on ? '✔' : '–') + '<\/span><\/td>';\n      }).join('');\n      return '<tr><td class=\"cust\"><a data-tenant=\"' + esc(t.id) + '\">' + esc(t.name) + '<\/a><small>' + esc(t.id) + ' · ' + esc(t.plan) + '<\/small><\/td>' + cells + '<td><b>' + n + '/' + D.features.length + '<\/b><\/td><\/tr>';\n    }).join('') || '<tr><td class=\"empty\" colspan=\"' + (D.features.length + 2) + '\">No customers match.<\/td><\/tr>';\n    $('matrix').innerHTML = head + '<tbody>' + body + '<\/tbody>';\n    $('matrixKey').innerHTML = '<div><span class=\"dot NO\"><\/span><b>Green<\/b> = No ticket required<\/div><div><span class=\"dot YES\"><\/span><b>Blue<\/b> = Ticket required<\/div><div><span class=\"dot HIGH\"><\/span><b>Red ⚠<\/b> = High risk<\/div>' +\n      D.features.map(function (f) { return '<div><b>' + esc(f.id) + '<\/b> ' + esc(f.name.replace(/^Feature \\d+ – /, '')) + '<\/div>'; }).join('');\n  }\n  function exportMatrixCsv() {\n    var lines = [['Tenant ID', 'Tenant'].concat(D.features.map(function (f) { return f.name + ' [' + ST[f.status].label + ']'; }))];\n    matrixTenants().forEach(function (t) { lines.push([t.id, t.name].concat(D.features.map(function (f) { return (t.features[f.id] || {}).enabled ? 'Enabled' : 'Not enabled'; }))); });\n    download('mops_all_customers_matrix.csv', lines);\n  }\n\n  /* ---------- events ---------- */\n  function toggleRow(tr) { if (!tr) return; var id = tr.dataset.id; state.open[id] = !state.open[id]; renderTable(); var again = document.querySelector('tr.frow[data-id=\"' + id + '\"]'); if (again && document.activeElement === document.body) again.focus(); }\n  function init() {\n    document.title = D.meta.title;\n    document.querySelector('h1').firstChild.nodeValue = D.meta.title + ' ';\n    document.querySelector('.banner').innerHTML = '🧪 <strong>' + esc(D.meta.banner) + '<\/strong>';\n    var types = Object.keys(D.meta.types);\n    $('typeFilter').innerHTML = '<option value=\"all\">Type: all<\/option>' + types.map(function (t) { return '<option>' + esc(t) + '<\/option>'; }).join('');\n    renderLegend(); renderMatrix(); renderAll();\n\n    $('tenantSearch').addEventListener('input', function () { renderAll(); });\n    $('tenantSelect').addEventListener('change', function (e) { state.tenantId = e.target.value; state.open = {}; renderAll(); });\n    $('statusChips').addEventListener('click', function (e) { var b = e.target.closest('.chip'); if (b) { state.status = b.dataset.status; renderChips(); renderTable(); } });\n    $('featSearch').addEventListener('input', function (e) { state.q = e.target.value; renderTable(); });\n    $('enabledFilter').addEventListener('change', function (e) { state.enabled = e.target.value; renderTable(); });\n    $('typeFilter').addEventListener('change', function (e) { state.type = e.target.value; renderTable(); });\n    $('resetBtn').addEventListener('click', function () {\n      state.status = 'ALL'; state.enabled = 'all'; state.type = 'all'; state.q = ''; state.sort = { key: 'name', dir: 1 };\n      $('featSearch').value = ''; $('enabledFilter').value = 'all'; $('typeFilter').value = 'all'; renderChips(); renderTable();\n    });\n    $('csvBtn').addEventListener('click', exportTenantCsv);\n    $('matrixCsvBtn').addEventListener('click', exportMatrixCsv);\n    $('matrixSearch').addEventListener('input', renderMatrix);\n    document.querySelector('#featTable thead').addEventListener('click', function (e) {\n      var th = e.target.closest('th[data-sort]'); if (!th) return;\n      var k = th.dataset.sort; state.sort = { key: k, dir: state.sort.key === k ? -state.sort.dir : 1 }; renderTable();\n    });\n    $('featBody').addEventListener('click', function (e) { toggleRow(e.target.closest('tr.frow')); });\n    $('featBody').addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { var tr = e.target.closest('tr.frow'); if (tr) { e.preventDefault(); toggleRow(tr); } } });\n    $('matrix').addEventListener('click', function (e) {\n      var a = e.target.closest('a[data-tenant]'); if (!a) return;\n      state.tenantId = a.dataset.tenant; state.open = {}; $('tenantSearch').value = ''; showTab('tenant'); renderAll();\n    });\n    document.querySelectorAll('.tab').forEach(function (b) { b.addEventListener('click', function () { showTab(b.dataset.tab); }); });\n    $('themeBtn').addEventListener('click', function () {\n      var cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');\n      document.documentElement.dataset.theme = cur === 'dark' ? 'light' : 'dark';\n    });\n  }\n  function showTab(name) {\n    document.querySelectorAll('.tab').forEach(function (b) { var on = b.dataset.tab === name; b.classList.toggle('active', on); b.setAttribute('aria-selected', on); });\n    $('tab-tenant').hidden = name !== 'tenant'; $('tab-overview').hidden = name !== 'overview';\n  }\n  init();\n})();\n\n<\/script>\n<\/body>\n<\/html>\n";

  const x=cnt.r/n*100, y=x+cnt.a/n*100;
  $("ring").style.background=`conic-gradient(var(--r) 0 ${x}%,var(--a) ${x}% ${y}%,var(--g) ${y}% 100%)`;
  $("avg").textContent=avg+"%"; $("avg").style.color=`var(--${band(avg)})`;
  $("legend").innerHTML=["r","a","g"].map(b=>`<button class="lg ${flt===BK[b]?"on":""}" data-f="${BK[b]}"><i style="background:var(--${b})"></i><span>${t(BK[b])}</span><b>${cnt[b]}</b></button>`).join("");
  $("nums").innerHTML=`<div><b>${fmt(tb)}</b><span>${t("pur")}</span></div><div><b style="color:var(--g)">${fmt(ta)}</b><span>${t("act")}</span></div><div><b style="color:var(--a)">${fmt(tb-ta)}</b><span>${t("pen")}</span></div>`;
  $("split").style.width=(ta/tb*100)+"%";
  $("splitl").innerHTML=`<span>${t("act")} ${Math.round(ta/tb*100)}%</span><span>${t("na")} ${100-Math.round(ta/tb*100)}%</span>`;
  $("chip").textContent="▲ "+t("imp")(DATA.filter(c=>c.dl>0).length);
  document.querySelectorAll("#legend .lg").forEach(b=>b.onclick=()=>{flt=flt===b.dataset.f?"all":b.dataset.f;statics();table()});
  $("fl").innerHTML=FL.map(([k,b])=>`<button class="fb ${flt===k?"on":""}" data-f="${k}">${t(k)}</button>`).join("");
  document.querySelectorAll("#fl .fb").forEach(b=>b.onclick=()=>{flt=b.dataset.f;statics();table()});
}
const COLS=[["name","co"],["bought","skuPur",1],["active","skuAct",1],["povEnd","pov",1],["pen","pen",1],["ad","ad",1],["dl","tr",1]];
function table(){
  $("head").innerHTML=COLS.map(([k,l,n])=>`<th class="${n?"n":""}" data-k="${k}">${t(l)}${sk===k?(sd>0?" ↑":" ↓"):""}</th>`).join("");
  document.querySelectorAll("#head th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(sk===k)sd*=-1;else{sk=k;sd=k==="name"?1:-1}table()});
  const q=qry.toLowerCase();
  const L=DATA.filter(c=>(flt==="all"||BK[band(c.ad)]===flt)&&(!q||c.name.toLowerCase().includes(q)||sec(c).toLowerCase().includes(q)));
  L.sort((a,b)=>(typeof a[sk]==="string"?a[sk].localeCompare(b[sk]):a[sk]-b[sk])*sd);
  $("rows").innerHTML=L.map(c=>{const b=band(c.ad),up=c.dl>=0;return`<tr data-i="${DATA.indexOf(c)}"><td><div class="co">${av(c.name)}<span><b>${esc(c.name)}</b><small>${sec(c)}</small></span></div></td><td class="n">${c.bought}</td><td class="n" style="color:var(--g)">${c.active}</td><td class="n">${povCell(c)}</td><td class="n" style="color:var(--a)">${c.pen}</td><td class="n"><span class="gauge" style="--p:${c.ad};--c:var(--${b})"><i>${c.ad}</i></span></td><td class="n"><div class="tr">${spark(c.q,up?"g":"r")}<span class="d ${up?"up":"dn"}">${c.dl===0?"–":(up?"▲ ":"▼ ")+Math.abs(c.dl)}</span></div></td></tr>`}).join("");
  document.querySelectorAll("#rows tr").forEach(r=>r.onclick=()=>open(DATA[r.dataset.i]));
  $("cnt").textContent=t("shown")(L.length,DATA.length);
}
const fmtD=iso=>new Date(iso+"T00:00:00Z").toLocaleDateString(lang==="en"?"en-US":"es-MX",{month:"short",day:"numeric",year:"numeric",timeZone:"UTC"});
const left=c=>Math.round((Date.parse(c.povEnd)-REF)/86400000);
function povCell(c){return c.povEnd?`<span class="povtag ${left(c)<=14?"warn":""}">POV · ${fmtD(c.povEnd)}</span>`:`<span class="muted">—</span>`}
function povBox(c){return c.povEnd?`<div class="povbox"><span class="povtag big">POV</span><div><b>${t("povActive")(fmtD(c.povEnd))}</b><span>${t("povStart")}: ${fmtD(c.povStart)} · ${t("povLeft")(left(c))}</span></div></div>`:`<div class="povbox none"><span>${t("povNone")}</span></div>`}
let cur=null;
function showView(v){
  const mops=v==="mops";
  document.querySelectorAll(".home").forEach(e=>e.hidden=mops);
  $("viewMops").hidden=!mops;
  if(mops && !$("mopsFrame").srcdoc) $("mopsFrame").srcdoc=MOPS_SRC;
  window.scrollTo(0,0);
}
document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>showView(b.dataset.open));
$("backBtn").onclick=()=>showView("home");
function open(c){
  cur=c;const b=band(c.ad);
  $("drawer").innerHTML=`<div class="dh"><div class="co">${av(c.name)}<span><b>${esc(c.name)}</b><small>${sec(c)}</small></span></div><button class="btn" id="x">${t("close")}</button></div>
  ${povBox(c)}
  <div class="ds"><div><b>${c.bought}</b><span>${t("pur")}</span></div><div><b style="color:var(--g)">${c.active}</b><span>${t("act")}</span></div><div><b style="color:var(--a)">${c.pen}</b><span>${t("na")}</span></div><div><b style="color:var(--${b})">${c.ad}%</b><span>${t("ad")}</span></div></div>
  <p class="dt">${t("hist")}</p>
  <div class="qs">${c.q.map((v,i)=>`<div><b>${v}%</b><i style="height:${Math.max(v*.62,4)}px;background:var(--${band(v)})"></i>${lang==="en"?"Q":"T"}${i+1}</div>`).join("")}</div>
  <p class="dt">${t("feats")}</p>
  ${c.feats.slice().sort((a,b)=>b.on-a.on||fn(a.i).localeCompare(fn(b.i))).map(f=>`<div class="ft"><span>${fn(f.i)}</span><span class="st ${f.on?"on1":"off1"}">${f.on?t("on"):t("off")}</span></div>`).join("")}`;
  $("x").onclick=close;$("drawer").classList.add("open");$("scrim").classList.add("open");$("x").focus();
}
function close(){cur=null;$("drawer").classList.remove("open");$("scrim").classList.remove("open")}
$("scrim").onclick=close;
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
$("q").addEventListener("input",e=>{qry=e.target.value;table()});
$("lang").onclick=()=>{lang=lang==="en"?"es":"en";statics();table();if(cur)open(cur)};
$("theme").onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==="dark"?"light":"dark"};
statics();table();
</script>
</body>
</html>
